  notes: "Fix phpunit deprecations and other testing issues\ndocs: icon license\nstyle: Changed CSS and icon assets to Lucide Icons with proper attribution\nrefactor: Accept Horde\\Util\\Variables in most places which accept Horde_Variables\nfix: Cannot use new with a static function\nfix: Use Horde_Form::createVariable() instead of new Horde_Form_Variable()\nchore(metadata): Fix autoloading rules\ntest: Cover modern forms and RDO Backend\nfeat: feature switch to use whups_driver or Rdo based backend\nfeat: Migrate to controllers and service architecture\ntest: Cover DDD objects with tests\nrefactor: Rewire routes to use individual controllers rather than WhupsUi\nrefactor: Delete many endpoints, we rely on rampage now\nrefactor: Delete many old style Horde_Forms obsoleted by refactor.\nfeat: Implement a DDD domain for whups\nrefactor: Factor out ticket sorting into an injectable TicketSorter\nfix: DI of ticket controllers failed due to Horde_Group binding\nrefactor: Replace old Horde_Session usage in remaining controllers with HordeSession\nrefactor: Use urlgenerator directly instead of static method\nrefactor: ReportsController now actually uses the permissions service rather than the static\nrefactor(controllers): Consistently use the new topbar service\nfeat: Provide a reusable TopbarService\nrefactor(ResponseTrait): Remove dependency on static addTopbarSearch\nrefactor(QueueViewController, TicketCreateController): Inject topbar directly rather than using static helper\nrefactor(reports): use modern HordeSession and DI rather than globals.\nrefactor: Reports controller\nstyle: php-cs-fixer\nrefactor: Support whups as the entrypoint script"
